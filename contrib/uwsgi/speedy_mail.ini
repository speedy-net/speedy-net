[uwsgi]
project = mail

chdir = /home/ubuntu/speedy-net

plugins = /usr/lib/uwsgi/plugins/python313
home = %(chdir)/env
module = speedy.%(project).wsgi:application

master = true
processes = 8
harakiri = 720
max-requests = 2000
listen = 256
reload-on-rss = 600

chmod-socket = 666
vacuum = true

uid = ubuntu
gid = ubuntu

touch-reload = /run/uwsgi/app/speedy_%(project)/reload
